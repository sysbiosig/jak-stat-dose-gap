[pytest]
# Unit tests (tests/test_pipeline.py) run without raw data in ~1 s.
# Integration tests (tests/test_reproduction.py) skip themselves unless the derived
# tables exist; those marked `slow` reload the ~260 MB of raw CSVs.
#   pytest                     everything available
#   pytest -m "not slow"       skip the raw-data reload
testpaths = tests
markers =
    slow: reloads raw single-cell CSVs (~30 s, ~1 GB peak)
filterwarnings =
    ignore::FutureWarning
    ignore::RuntimeWarning
